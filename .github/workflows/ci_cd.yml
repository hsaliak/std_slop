name: CI/CD - Multi-Platform Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-test-release:
    name: ${{ matrix.os }} Build & Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: std_slop-linux-x86_64
          - os: macos-latest
            artifact_name: std_slop-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Mount bazel cache
        uses: actions/cache@v4
        with:
          path: "~/.cache/bazel"
          key: bazel-cache-${{ matrix.os }}-${{ hashFiles('**/MODULE.bazel', '**/MODULE.bazel.lock') }}
          restore-keys: |
            bazel-cache-${{ matrix.os }}-

      - name: Bazel Test
        run: |
          bazel test //...

      - name: Build Optimized Binary
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          bazel build -c opt //:std_slop
          cp bazel-bin/std_slop ${{ matrix.artifact_name }}

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
          generate_release_notes: true
