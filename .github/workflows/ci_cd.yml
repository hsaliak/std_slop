name: CI/CD - Multi-Platform Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-test-release:
    name: ${{ matrix.os }} Build & Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: std_slop-linux-x86_64
          - os: macos-latest
            artifact_name: std_slop-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache Bazel repository cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ matrix.os }}-${{ hashFiles('**/MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-${{ matrix.os }}-

      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ matrix.os }}-${{ github.sha }}
          restore-keys: |
            bazel-disk-${{ matrix.os }}-

      - name: Prefetch readline source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/bazel-distdir"
          expected_sha256="3feb7171f16a84ee82ca18a36d7b9be109a52c04f492a053331d7d1095007c35"
          output="$HOME/.cache/bazel-distdir/readline-8.2.tar.gz"
          tmp="$output.tmp"
          for url in \
            "https://mirrors.kernel.org/gnu/readline/readline-8.2.tar.gz" \
            "https://ftpmirror.gnu.org/gnu/readline/readline-8.2.tar.gz" \
            "https://ftp.gnu.org/pub/gnu/readline/readline-8.2.tar.gz"; do
            if curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 "$url" --output "$tmp"; then
              actual_sha256="$(python3 -c 'import hashlib, pathlib, sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$tmp")"
              if [[ "$actual_sha256" == "$expected_sha256" ]]; then
                mv "$tmp" "$output"
                exit 0
              fi
              echo "Checksum mismatch for $url: $actual_sha256" >&2
            fi
          done
          echo "Failed to prefetch readline-8.2.tar.gz from all mirrors" >&2
          exit 1

      - name: Bazel Test
        shell: bash
        run: |
          set -o pipefail
          bazel test //... \
            --repository_cache="$HOME/.cache/bazel-repo" \
            --disk_cache="$HOME/.cache/bazel-disk" \
            --distdir="$HOME/.cache/bazel-distdir" \
            2>&1 | tee bazel-test.log

      - name: Upload Bazel Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-test-logs-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bazel-test.log
            bazel-testlogs/**/test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Optimized Binary
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          bazel build //:std_slop \
            --repository_cache="$HOME/.cache/bazel-repo" \
            --disk_cache="$HOME/.cache/bazel-disk" \
            --distdir="$HOME/.cache/bazel-distdir"
          cp bazel-bin/app/std_slop ${{ matrix.artifact_name }}

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
          generate_release_notes: true
