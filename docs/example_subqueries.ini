# Example config with INI-based llm_query specializations.
# Use with: std_slop --config docs/example_subqueries.ini

[slop]
# Standard runtime settings
openai_api_key = ${LOGGING_OPENROUTER_API_KEY}
openai_base_url = https://openrouter.ai/api/v1
model = google/gemini-3-flash-preview

[llm_tool.code_review_llm]
system_prompt_patch = You are a strict code reviewer focused on correctness, regressions, and test gaps.
session_id = code_review
skill = code_reviewer
context_window = 8

[llm_tool.explorer_llm]
system_prompt_patch = You explore repository structure and summarize findings with exact file paths.
session_id = data_explorer
skill = data_explorer
context_window = 20
