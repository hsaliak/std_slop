# To use this config, run: std_slop --config docs/example_config.ini
# Environment variables will be resolved at runtime.

[slop]
# OpenRouter via OpenAI-compatible API
openai_api_key = ${LOGGING_OPENROUTER_API_KEY}
openai_base_url = https://openrouter.ai/api/v1


# Default model (cheap + explicitly agentic in model description)
model = your-model-name

# Optional
# openai_oauth = true     # forces OpenAI Responses API using ~/.config/slop/chatgpt_plus_token.json; bootstrap with `std_slop --fetch_openai_oauth_token` or `std_slop --fetch_openai_oauth_device_token` first
# openai_oauth_token_path = /custom/path/chatgpt_plus_token.json
# db = ~/.config/slop/slop.db
