
# textproto for rpc/server_config.proto

listen_addr: "0.0.0.0:50051"
db_path: "slop_rpc.db"

provider {
  provider: "gemini"
  model: "gemini-2.5-pro"
  gemini_api_key_env: "GEMINI_API_KEY"
}

policy {
  disable_ask_user: true
  allow_request_model_override: true
  allow_request_skill_override: true
  allow_request_context_window_override: true
  max_context_window: 0
}

defaults {
  active_skills: "code_reviewer"
  context_window: 12
}

# Mirrors docs/example_subqueries.ini specialization sections.
llm_tool_specializations {
  name: "code_review_llm"
  system_prompt_patch: "You are a strict code reviewer focused on correctness, regressions, and test gaps."
  session_id: "code_review"
  skill: "code_reviewer"
  context_window: 8
}

llm_tool_specializations {
  name: "explorer_llm"
  system_prompt_patch: "You explore repository structure and summarize findings with exact file paths."
  session_id: "data_explorer"
  skill: "data_explorer"
  context_window: 0
}
