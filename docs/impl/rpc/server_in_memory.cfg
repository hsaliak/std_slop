
# textproto for rpc/server_config.proto

listen_addr: "127.0.0.1:50052"
db_path: ":memory:"

provider {
  provider: "openai"
  model: "gpt-5.3-codex"

  # API key mode (default): reads key from env var named here.
  #openai_api_key_env: "OPENAI_API_KEY"
  #openai_base_url: "https://openrouter.ai/api/v1"

  # Optional custom OpenAI-compatible endpoint (for example OpenRouter).
  # openai_base_url: "https://openrouter.ai/api/v1"

  # Optional Responses API mode for API-key auth.
  # use_responses: true

  # OAuth mode (ChatGPT Plus/Pro token flow).
  # - Set true to use OAuth tokens from local token storage.
  # - When true, openai_api_key_env is not required.
  # - Runtime forces the OpenAI OAuth base URL; openai_base_url is ignored.
  openai_oauth: true
}
policy {
  disable_ask_user: true
  allow_request_model_override: false
  allow_request_skill_override: false
  allow_request_context_window_override: false
}

defaults {
  context_window: 6
}

# In-memory profile still supports llm_query specializations.
llm_tool_specializations {
  name: "code_review_llm"
  system_prompt_patch: "You are a strict code reviewer focused on correctness and regressions."
  session_id: "code_review"
  skill: "code_reviewer"
  context_window: 4
}
