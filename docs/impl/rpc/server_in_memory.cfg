
# textproto for rpc/server_config.proto

listen_addr: "127.0.0.1:50052"
db_path: ":memory:"

provider {
  provider: "gemini"
  model: "gemini-2.5-flash"
  gemini_api_key_env: "GEMINI_API_KEY"
}

policy {
  disable_ask_user: true
  allow_request_model_override: false
  allow_request_skill_override: false
  allow_request_context_window_override: false
}

defaults {
  context_window: 6
}

# In-memory profile still supports llm_query specializations.
llm_tool_specializations {
  name: "code_review_llm"
  system_prompt_patch: "You are a strict code reviewer focused on correctness and regressions."
  session_id: "code_review"
  skill: "code_reviewer"
  context_window: 4
}
